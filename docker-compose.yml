name: stats-radar

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: stats-radar/app:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      RUN_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - radar

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: stats-radar/app:local
    restart: unless-stopped
    command: ["su-exec", "www-data", "php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      RUN_MIGRATIONS: "false"
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - radar

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: stats-radar/web:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - radar

  test:
    profiles: ["testing"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    image: stats-radar/test:local
    entrypoint: ["php", "artisan", "test"]
    environment:
      APP_ENV: testing
    volumes:
      # Tests are excluded from the production image via .dockerignore.
      - ./tests:/var/www/html/tests:ro
      - ./phpunit.xml:/var/www/html/phpunit.xml:ro
    networks:
      - radar

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-stats_radar}
      POSTGRES_USER: ${DB_USERNAME:-stats_radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stats_radar} -d ${DB_DATABASE:-stats_radar}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - radar

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - radar

networks:
  radar:
    driver: bridge

volumes:
  app-storage:
  db-data:
  redis-data:
