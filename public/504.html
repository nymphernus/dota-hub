<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>504 Время ожидания истекло — DOTAHUB</title>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: #0f111a;
            color: #ffffff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        main {
            width: min(100%, 560px);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border: 1px solid rgba(244, 63, 94, 0.25);
            background: rgba(244, 63, 94, 0.08);
            color: #fda4af;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 24px auto 0;
            display: grid;
            place-items: center;
            border: 1px solid rgba(244, 63, 94, 0.25);
            background: rgba(244, 63, 94, 0.07);
            color: #fda4af;
        }
        h1 {
            margin: 24px 0 12px;
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0;
            color: #a4adbd;
            font-size: 15px;
            line-height: 1.6;
        }
        .actions { margin-top: 32px; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 20px;
            border: 1px solid #eab308;
            background: #eab308;
            color: #0f111a;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: filter 0.15s ease;
        }
        a:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <main>
        <span class="badge">504</span>

        <div class="icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M7 18h10a4 4 0 0 0 .7-7.9A6 6 0 0 0 6.1 8.3 4.5 4.5 0 0 0 7 18z" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 10.5v3.2M12 16.5v.2" stroke-linecap="round" />
            </svg>
        </div>

        <h1>504 Время ожидания истекло</h1>
        <p>Сервер не успел ответить. Попробуйте обновить страницу позже.</p>

        <div class="actions">
            <a href="/">Вернуться на главную</a>
        </div>
    </main>
</body>
</html>
